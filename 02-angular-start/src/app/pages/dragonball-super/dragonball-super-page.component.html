

<h1>DragonBall SUPER Page</h1>
<hr>

<section class="row">
  <div class="col-12 col-sm-6" style="height: 500px;">
    <h3>Name: {{ name() }}</h3>
    <input type="text" class="form-control" placeholder="Nombre" [value] = "name()"
    (change)="name.set( txtName.value )" 
    (input)="name.set( txtName.value )" 
    #txtName/>

    <h3>Poder: {{ power() }}</h3>
    <input type="number" class="form-control mt-2" placeholder="Poder"
    [value] = "power()"
    (input)="power.set( +txtPower.value )" 
    #txtPower/>

    <button (click) = "addCharacters()" class="mt-2 btn btn-success">
      Agregar
    </button>
  </div>

  <div class="col-12 col-sm-6">

<dragonball-character-list [characters] = "characters()"/>

  </div>

</section>
